spring:
  datasource:
    url: jdbc:h2:mem:cranhua
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  ai:
    google:
      genai:
        api-key: ${GEMINI_API_KEY}
        chat:
          options:
            model: gemini-3.5-flash-lite
    model:
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none

management:
  endpoints:
    web:
      exposure:
        include: health

# Origen local de Angular (dev). Separar con comas si hay varios.
app:
  cors:
    allowed-origins: http://localhost:4200

