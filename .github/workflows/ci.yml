name: CI

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]

jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # google-java-format >= 1.29 requires JDK 21+ to run
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Check Google Java Format
        uses: axel-op/googlejavaformat-action@v4
        with:
          args: "--set-exit-if-changed"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build with Maven
        run: mvn -B verify
